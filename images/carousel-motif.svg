<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Symbolic carousel motif: a quiet circle of memory, return, and intergenerational duty">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D5A642" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D5A642" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D5A642" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C875"/>
      <stop offset="100%" stop-color="#9C7426"/>
    </linearGradient>
  </defs>
  <circle cx="300" cy="300" r="280" fill="url(#g1)"/>
  <g fill="none" stroke="url(#ringGrad)" stroke-linecap="round">
    <circle cx="300" cy="300" r="220" stroke-width="1.2" opacity="0.85"/>
    <circle cx="300" cy="300" r="180" stroke-width="0.8" opacity="0.55"/>
    <circle cx="300" cy="300" r="140" stroke-width="0.6" opacity="0.4"/>
    <circle cx="300" cy="300" r="100" stroke-width="0.5" opacity="0.3"/>
  </g>
  <g stroke="url(#ringGrad)" stroke-width="1" opacity="0.7" stroke-linecap="round">
    <line x1="300" y1="80" x2="300" y2="520"/>
    <line x1="80" y1="300" x2="520" y2="300"/>
    <line x1="144" y1="144" x2="456" y2="456"/>
    <line x1="456" y1="144" x2="144" y2="456"/>
  </g>
  <g fill="#E7C875">
    <circle cx="300" cy="80" r="3.2"/>
    <circle cx="300" cy="520" r="3.2"/>
    <circle cx="80" cy="300" r="3.2"/>
    <circle cx="520" cy="300" r="3.2"/>
    <circle cx="144" cy="144" r="2.4"/>
    <circle cx="456" cy="144" r="2.4"/>
    <circle cx="144" cy="456" r="2.4"/>
    <circle cx="456" cy="456" r="2.4"/>
  </g>
  <circle cx="300" cy="300" r="6" fill="#E7C875"/>
